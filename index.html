<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuT-Antragshelfer - TSV 1862 Friedberg</title>
<style>
  :root {
    --petrol: #0D7377;
    --petrol-dark: #095457;
    --ink: #1C2B2D;
    --paper: #FAFAF8;
    --line: #D8DFDE;
    --error: #B3261E;
    --ok: #1E7B4D;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
  }
  html[dir="rtl"] body { direction: rtl; }

  .shell { max-width: 640px; margin: 0 auto; padding: 24px 20px 80px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; gap: 12px; flex-wrap: wrap;
  }
  header.top h1 { font-size: 1.25rem; margin: 0; color: var(--petrol-dark); }

  select#langSelect {
    font-size: 0.9rem; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: var(--radius); background: #fff; color: var(--ink);
  }

  .intro {
    background: #EEF6F6; border: 1px solid #CFE6E6; border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 24px;
  }
  .intro h2 { margin: 0 0 8px; font-size: 1rem; color: var(--petrol-dark); }
  .intro p { margin: 0; font-size: 0.92rem; }

  .progress {
    display: flex; gap: 6px; margin-bottom: 24px;
  }
  .progress .seg {
    flex: 1; height: 4px; border-radius: 2px; background: var(--line);
  }
  .progress .seg.done { background: var(--petrol); }

  .step { display: none; }
  .step.active { display: block; }

  .step h2 { font-size: 1.1rem; margin: 0 0 4px; }
  .step .hint { font-size: 0.85rem; color: #556; margin: 0 0 18px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; }
  .field .req { color: var(--petrol); font-weight: 400; }
  .field input[type=text],
  .field input[type=email],
  .field input[type=tel],
  .field input[type=date],
  .field input[type=number],
  .field select {
    width: 100%; padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: #fff; color: var(--ink);
  }
  .field input:focus, .field select:focus {
    outline: 2px solid var(--petrol); outline-offset: 1px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 12px; }
  @media (max-width: 480px) {
    .row2, .row3 { grid-template-columns: 1fr; }
  }

  .checkbox-group { display: flex; flex-direction: column; gap: 10px; }
  .checkbox-item {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; cursor: pointer;
  }
  .checkbox-item input { margin-top: 3px; width: 18px; height: 18px; flex-shrink: 0; }
  .checkbox-item span { font-size: 0.95rem; }

  .kind-block {
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 18px; background: #fff;
  }
  .kind-block-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .kind-block-title { margin: 0; font-size: 1rem; color: var(--petrol-dark); }
  .kind-remove {
    background: transparent; border: 1px solid var(--error); color: var(--error);
    font-size: 0.8rem; padding: 6px 12px;
  }
  .faellig-hint { font-size: 0.8rem; color: #556; margin-top: 4px; }

  .consent-box {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; font-size: 0.88rem; margin-bottom: 16px;
  }

  .nav-buttons {
    display: flex; justify-content: space-between; margin-top: 28px; gap: 12px;
  }
  button {
    font-size: 1rem; padding: 12px 22px; border-radius: var(--radius);
    border: 1px solid var(--petrol); cursor: pointer; font-weight: 600;
  }
  button.primary { background: var(--petrol); color: #fff; }
  button.primary:hover { background: var(--petrol-dark); }
  button.secondary { background: transparent; color: var(--petrol); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .success {
    text-align: center; padding: 40px 20px;
  }
  .success .icon {
    width: 56px; height: 56px; border-radius: 50%; background: var(--ok);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin: 0 auto 16px;
  }
  .success h2 { color: var(--ok); margin-bottom: 8px; }

  .error-msg {
    color: var(--error); font-size: 0.85rem; margin-top: 4px; display: none;
  }
  .field.invalid input, .field.invalid select { border-color: var(--error); }
  .field.invalid .error-msg:not(.plz-invalid-msg) { display: block; }
  .field .plz-invalid-msg { display: none; }
  .field.plz-invalid input { border-color: var(--error); }
  .field.plz-invalid .plz-invalid-msg { display: block; }

  .devmode-badge {
    position: fixed; bottom: 12px; right: 12px; z-index: 999;
    background: #B3261E; color: #fff; font-size: 0.75rem; font-weight: 700;
    padding: 6px 12px; border-radius: 20px; letter-spacing: 0.03em;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  html[dir="rtl"] .devmode-badge { right: auto; left: 12px; }

  /* Zusammenfassung / Druckansicht */
  .summary {
    margin-top: 28px; border: 1px solid var(--line); border-radius: var(--radius);
    background: #fff; padding: 20px 22px;
  }
  .summary-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 4px;
  }
  .summary-header h2 { margin: 0; font-size: 1.05rem; color: var(--petrol-dark); }
  .summary-header button { padding: 10px 16px; font-size: 0.9rem; }
  .summary-meta { font-size: 0.78rem; color: #667; margin: 0 0 16px; }
  .summary-section { margin-bottom: 16px; }
  .summary-section h3 {
    font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--petrol); border-bottom: 1px solid var(--line);
    padding-bottom: 4px; margin: 0 0 8px;
  }
  .summary-row {
    display: flex; justify-content: space-between; gap: 16px;
    font-size: 0.92rem; padding: 3px 0;
  }
  .summary-row .k { color: #556; }
  .summary-row .v { font-weight: 600; text-align: right; }
  html[dir="rtl"] .summary-row .v { text-align: left; }
  .summary-plain { margin: 0; font-size: 0.92rem; font-weight: 600; }

  .pdf-box {
    margin-top: 20px; border: 2px solid var(--petrol); border-radius: var(--radius);
    background: #EEF6F6; padding: 20px 22px;
  }
  .pdf-box .field label { color: var(--petrol-dark); }
  .pdf-hint { font-size: 0.85rem; color: #445; margin: 4px 0 14px; }
  .pdf-status { font-size: 0.88rem; margin-top: 10px; text-align: center; }
  .pdf-status.error { color: var(--error); }
  .pdf-status.ok { color: var(--ok); }

  @media print {
    .no-print, header.top, .intro, .progress, .nav-buttons, .devmode-badge, .pdf-box { display: none !important; }
    body { background: #fff; }
    .step { display: none !important; }
    .step[data-step="4"] { display: block !important; }
    .summary { border: none; padding: 0; }
  }
</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <h1 id="appTitle">Zuschuss beantragen</h1>
    <select id="langSelect" aria-label="Sprache">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="tr">Türkçe</option>
      <option value="ar">العربية</option>
      <option value="ru">Русский</option>
      <option value="uk">Українська</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
    </select>
  </header>

  <div class="intro">
    <h2 id="introTitle"></h2>
    <p id="introText"></p>
  </div>

  <div class="progress" id="progressBar"></div>

  <form id="butForm" novalidate>

    <!-- Step 1: Stammdaten (familienweit) -->
    <section class="step active" data-step="0">
      <h2 id="step1Title"></h2>

      <div class="field">
        <label for="erzName"><span data-t="field_erz_name"></span> <span class="req">*</span></label>
        <input type="text" id="erzName" required>
        <div class="error-msg" data-t="required_hint"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="erzGeburtsdatum"><span data-t="field_erz_geburtsdatum"></span> <span class="req">*</span></label>
          <input type="date" id="erzGeburtsdatum" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
        <div class="field">
          <label for="erzBeziehung"><span data-t="field_erz_beziehung"></span> <span class="req">*</span></label>
          <select id="erzBeziehung" required>
            <option value="mutter" data-t="erz_beziehung_mutter"></option>
            <option value="vater" data-t="erz_beziehung_vater"></option>
            <option value="sorgeberechtigt" data-t="erz_beziehung_sorgeberechtigt"></option>
            <option value="vormund" data-t="erz_beziehung_vormund"></option>
            <option value="sonstige" data-t="erz_beziehung_sonstige"></option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="adresseStrasse"><span data-t="field_adresse_strasse"></span> <span class="req">*</span></label>
        <input type="text" id="adresseStrasse" required>
        <div class="error-msg" data-t="required_hint"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="adressePlz"><span data-t="field_adresse_plz"></span> <span class="req">*</span></label>
          <input type="text" id="adressePlz" required inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="postal-code">
          <div class="error-msg" data-t="required_hint"></div>
          <div class="error-msg plz-invalid-msg" data-t="plz_invalid_hint"></div>
        </div>
        <div class="field">
          <label for="adresseOrt"><span data-t="field_adresse_ort"></span> <span class="req">*</span></label>
          <input type="text" id="adresseOrt" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="kontaktEmail"><span data-t="field_kontakt_email"></span> <span class="req">*</span></label>
          <input type="email" id="kontaktEmail" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
        <div class="field">
          <label for="kontaktTelefon"><span data-t="field_kontakt_telefon"></span> <span class="req">*</span></label>
          <input type="tel" id="kontaktTelefon" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
      </div>
    </section>

    <!-- Step 2: Leistungsbezug -->
    <section class="step" data-step="1">
      <h2 id="step2Title"></h2>
      <div class="checkbox-group" id="leistungGroup">
        <label class="checkbox-item">
          <input type="checkbox" name="leistung" value="buergergeld">
          <span data-t="leistung_buergergeld"></span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="leistung" value="sozialhilfe">
          <span data-t="leistung_sozialhilfe"></span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="leistung" value="wohngeld">
          <span data-t="leistung_wohngeld"></span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="leistung" value="kinderzuschlag">
          <span data-t="leistung_kinderzuschlag"></span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="leistung" value="asylblg">
          <span data-t="leistung_asylblg"></span>
        </label>
      </div>
      <div class="error-msg" id="leistungError" data-t="required_hint" style="display:none;"></div>
    </section>

    <!-- Step 3: Kinder (wiederholbar) -->
    <section class="step" data-step="2">
      <h2 id="step3Title"></h2>
      <p class="hint" id="step3Hint"></p>

      <div id="kinderContainer"></div>

      <button type="button" class="secondary no-print" id="btnAddKind" style="width:100%; margin-top:8px;"></button>
    </section>

    <template id="kindBlockTemplate">
      <div class="kind-block">
        <div class="kind-block-header">
          <h3 class="kind-block-title"></h3>
          <button type="button" class="kind-remove no-print" data-t="button_remove_kind"></button>
        </div>

        <div class="field">
          <label><span data-t="field_kind_vorname"></span> <span class="req">*</span></label>
          <input type="text" data-field="vorname" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
        <div class="row2">
          <div class="field">
            <label><span data-t="field_kind_nachname"></span> <span class="req">*</span></label>
            <input type="text" data-field="nachname" required>
            <div class="error-msg" data-t="required_hint"></div>
          </div>
          <div class="field">
            <label><span data-t="field_kind_geburtsdatum"></span> <span class="req">*</span></label>
            <input type="date" data-field="geburtsdatum" required>
            <div class="error-msg" data-t="required_hint"></div>
          </div>
        </div>

        <div class="field">
          <label><span data-t="field_aktivitaet_beschreibung"></span> <span class="req">*</span></label>
          <input type="text" data-field="beschreibung" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>

        <div class="row2">
          <div class="field">
            <label><span data-t="field_zeitraum_von"></span> <span class="req">*</span></label>
            <input type="date" data-field="zeitraum_von" required>
            <div class="error-msg" data-t="required_hint"></div>
          </div>
          <div class="field">
            <label><span data-t="field_zeitraum_bis"></span> <span class="req">*</span></label>
            <input type="date" data-field="zeitraum_bis" required>
            <div class="error-msg" data-t="required_hint"></div>
          </div>
        </div>

        <div class="row2">
          <div class="field">
            <label><span data-t="field_beitrag_betrag"></span> <span class="req">*</span></label>
            <input type="number" data-field="beitrag_betrag" required min="0" step="0.01">
            <div class="error-msg" data-t="required_hint"></div>
          </div>
          <div class="field">
            <label><span data-t="field_beitrag_rhythmus"></span> <span class="req">*</span></label>
            <select data-field="beitrag_rhythmus" required>
              <option value="monat" data-t="rhythmus_monat"></option>
              <option value="quartal" data-t="rhythmus_quartal"></option>
              <option value="halbjahr" data-t="rhythmus_halbjahr"></option>
              <option value="jahr" data-t="rhythmus_jahr"></option>
            </select>
          </div>
        </div>

        <div class="field">
          <label><span data-t="field_faellig_am"></span> <span class="req">*</span></label>
          <select data-field="faellig_am" required></select>
          <div class="faellig-hint" data-t="field_faellig_am_hint"></div>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
      </div>
    </template>

    <!-- Step 4: Einwilligung -->
    <section class="step" data-step="3">
      <h2 id="consentTitle"></h2>
      <div class="consent-box" id="consentText"></div>
      <label class="checkbox-item">
        <input type="checkbox" id="consentCheckbox" required>
        <span id="consentCheckboxLabel"></span>
      </label>
      <div class="error-msg" id="consentError" data-t="required_hint" style="display:none;"></div>
    </section>

    <!-- Success -->
    <section class="step" data-step="4">
      <div class="success no-print">
        <div class="icon">&#10003;</div>
        <h2 id="successTitle"></h2>
        <p id="successText"></p>
      </div>

      <div class="summary" id="summaryBox">
        <div class="summary-header">
          <h2 id="summaryTitle"></h2>
        </div>
        <p class="summary-meta" id="summaryGeneratedOn"></p>
        <div id="summaryContent"></div>
      </div>

      <div class="pdf-box no-print">
        <div class="field">
          <label for="behoerdeSelect" data-t="field_behoerde"></label>
          <select id="behoerdeSelect">
            <option value="aichach_friedberg" data-t="behoerde_aichach_friedberg"></option>
            <option value="augsburg" data-t="behoerde_augsburg"></option>
          </select>
        </div>
        <p class="pdf-hint" id="downloadHint"></p>
        <button type="button" class="primary" id="btnDownloadPdf" style="width:100%;"></button>
        <p class="pdf-status" id="pdfStatus" style="display:none;"></p>
      </div>
    </section>

    <div class="nav-buttons" id="navButtons">
      <button type="button" class="secondary" id="btnBack"></button>
      <button type="button" class="primary" id="btnNext"></button>
    </div>

  </form>
</div>

<div class="devmode-badge no-print" id="devModeBadge" style="display:none;">TESTMODUS - Pflichtfelder aus</div>

<script>
(function () {
  const i18n = JSON.parse(document.getElementById('i18nData').textContent);
  const RTL_LANGS = ['ar'];
  const steps = Array.from(document.querySelectorAll('.step'));
  const totalFormSteps = 4; // 0..3, step 4 = success screen
  let current = 0;
  let lang = 'de';
  let lastFormData = null;

  const progressBar = document.getElementById('progressBar');
  function renderProgress() {
    progressBar.innerHTML = '';
    for (let i = 0; i < totalFormSteps; i++) {
      const seg = document.createElement('div');
      seg.className = 'seg' + (i <= current && current < totalFormSteps ? (i < current || current === i ? ' done' : '') : '');
      if (current >= totalFormSteps) seg.classList.add('done');
      else if (i <= current) seg.classList.add('done');
      progressBar.appendChild(seg);
    }
    progressBar.style.display = current >= totalFormSteps ? 'none' : 'flex';
  }

  function applyLang() {
    const dict = i18n[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = RTL_LANGS.includes(lang) ? 'rtl' : 'ltr';

    document.getElementById('appTitle').textContent = dict.app_title;
    document.getElementById('introTitle').textContent = dict.intro_title;
    document.getElementById('introText').textContent = dict.intro_text;
    document.getElementById('step1Title').textContent = dict.step1_title;
    document.getElementById('step2Title').textContent = dict.step2_title;
    document.getElementById('step3Title').textContent = dict.step3_title;
    document.getElementById('step3Hint').textContent = dict.step3_hint;
    document.getElementById('btnAddKind').textContent = dict.button_add_kind;
    document.getElementById('consentTitle').textContent = dict.step_consent_title;
    document.getElementById('consentText').textContent = dict.consent_text;
    document.getElementById('consentCheckboxLabel').textContent = dict.consent_checkbox;
    document.getElementById('successTitle').textContent = dict.submit_success_title;
    document.getElementById('successText').textContent = dict.submit_success_text;
    document.querySelectorAll('[data-field="beschreibung"]').forEach(el => {
      el.placeholder = dict.field_aktivitaet_beschreibung_placeholder;
    });
    document.getElementById('summaryTitle').textContent = dict.summary_title;
    document.getElementById('btnDownloadPdf').textContent = dict.button_download_pdf;
    document.getElementById('downloadHint').textContent = dict.download_hint;
    renumberKindBlocks();
    if (lastFormData) renderSummary(lastFormData);

    document.querySelectorAll('[data-t]').forEach(el => {
      const key = el.getAttribute('data-t');
      if (dict[key] !== undefined) el.textContent = dict[key];
    });

    updateNavButtons();
  }

  function updateNavButtons() {
    const dict = i18n[lang];
    const backBtn = document.getElementById('btnBack');
    const nextBtn = document.getElementById('btnNext');
    backBtn.textContent = dict.button_back;
    backBtn.style.visibility = current === 0 ? 'hidden' : 'visible';
    if (current >= totalFormSteps) {
      document.getElementById('navButtons').style.display = 'none';
    } else {
      document.getElementById('navButtons').style.display = 'flex';
      nextBtn.textContent = current === totalFormSteps - 1 ? dict.button_submit : dict.button_next;
    }
  }

  function showStep() {
    steps.forEach(s => s.classList.toggle('active', Number(s.dataset.step) === current));
    renderProgress();
    updateNavButtons();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ============================================================
  // TESTMODUS: Pflichtfeld-Validierung ist bewusst deaktiviert,
  // damit waehrend der Bearbeitung frei durch alle Schritte
  // geklickt werden kann, ohne Felder auszufuellen.
  // Vor dem echten Livegang WIEDER AUF false SETZEN!
  // ============================================================
  const DEV_MODE_SKIP_VALIDATION = true;

  function validateCurrentStep() {
    if (DEV_MODE_SKIP_VALIDATION) return true;

    let valid = true;
    const stepEl = steps.find(s => Number(s.dataset.step) === current);
    if (!stepEl) return true;

    const inputs = stepEl.querySelectorAll('input[required], select[required]');
    inputs.forEach(inp => {
      const field = inp.closest('.field');
      const ok = inp.type === 'checkbox' ? inp.checked : inp.value.trim() !== '';
      if (!ok) {
        valid = false;
        if (field) field.classList.add('invalid');
      } else if (field) {
        field.classList.remove('invalid');
      }
    });

    if (current === 0) {
      const plzField = document.getElementById('adressePlz');
      const plzVal = plzField.value.trim();
      const plzFormatBad = plzVal !== '' && !isValidPlz(plzVal);
      plzField.closest('.field').classList.toggle('plz-invalid', plzFormatBad);
      if (plzVal === '' || plzFormatBad) valid = false;
    }

    if (current === 1) {
      const anyChecked = Array.from(document.querySelectorAll('input[name=leistung]')).some(c => c.checked);
      document.getElementById('leistungError').style.display = anyChecked ? 'none' : 'block';
      if (!anyChecked) valid = false;
    }

    if (current === 2) {
      const blockInputsOk = Array.from(document.querySelectorAll('.kind-block input[required], .kind-block select[required]'))
        .every(inp => inp.value.trim() !== '');
      if (!blockInputsOk) valid = false;
    }

    if (current === 3) {
      const consentOk = document.getElementById('consentCheckbox').checked;
      document.getElementById('consentError').style.display = consentOk ? 'none' : 'block';
      if (!consentOk) valid = false;
    }

    return valid;
  }

  // ============================================================
  // Kinder-Bloecke: wiederholbare Kind + Vereinsmitgliedschaft-Gruppe
  // ============================================================
  function addKindBlock() {
    const template = document.getElementById('kindBlockTemplate');
    const clone = template.content.cloneNode(true);
    document.getElementById('kinderContainer').appendChild(clone);
    const dict = i18n[lang];
    const blocks = document.querySelectorAll('.kind-block');
    const newBlock = blocks[blocks.length - 1];
    newBlock.querySelectorAll('[data-t]').forEach(el => {
      const key = el.getAttribute('data-t');
      if (dict[key] !== undefined) el.textContent = dict[key];
    });
    newBlock.querySelector('[data-field="beschreibung"]').placeholder = dict.field_aktivitaet_beschreibung_placeholder;
    populateFaelligSelect(newBlock.querySelector('[data-field="faellig_am"]'));
    newBlock.querySelector('.kind-remove').addEventListener('click', () => {
      if (document.querySelectorAll('.kind-block').length <= 1) return; // mind. 1 Kind bleibt erhalten
      newBlock.remove();
      renumberKindBlocks();
    });
    renumberKindBlocks();
  }

  function populateFaelligSelect(selectEl) {
    selectEl.innerHTML = '';
    for (let day = 1; day <= 31; day++) {
      const opt = document.createElement('option');
      opt.value = String(day);
      opt.textContent = day + '.';
      selectEl.appendChild(opt);
    }
  }

  function renumberKindBlocks() {
    const blocks = document.querySelectorAll('.kind-block');
    blocks.forEach((block, i) => {
      block.querySelector('.kind-block-title').textContent = labelFor('summary_section_kind') + ' ' + (i + 1);
      const removeBtn = block.querySelector('.kind-remove');
      removeBtn.style.display = blocks.length <= 1 ? 'none' : 'inline-block';
    });
  }

  function collectFormData() {
    const kinder = Array.from(document.querySelectorAll('.kind-block')).map(block => ({
      vorname: block.querySelector('[data-field="vorname"]').value.trim(),
      nachname: block.querySelector('[data-field="nachname"]').value.trim(),
      geburtsdatum: block.querySelector('[data-field="geburtsdatum"]').value,
      aktivitaet: {
        beschreibung: block.querySelector('[data-field="beschreibung"]').value.trim(),
        zeitraum_von: block.querySelector('[data-field="zeitraum_von"]').value,
        zeitraum_bis: block.querySelector('[data-field="zeitraum_bis"]').value,
        beitrag_betrag: block.querySelector('[data-field="beitrag_betrag"]').value,
        beitrag_rhythmus: block.querySelector('[data-field="beitrag_rhythmus"]').value,
        faellig_am: block.querySelector('[data-field="faellig_am"]').value ? block.querySelector('[data-field="faellig_am"]').value + '.' : ''
      }
    }));

    return {
      erziehungsberechtigter: {
        name: document.getElementById('erzName').value.trim(),
        geburtsdatum: document.getElementById('erzGeburtsdatum').value,
        beziehung: document.getElementById('erzBeziehung').value
      },
      adresse: {
        strasse: document.getElementById('adresseStrasse').value.trim(),
        plz: document.getElementById('adressePlz').value.trim(),
        ort: document.getElementById('adresseOrt').value.trim()
      },
      kontakt: {
        email: document.getElementById('kontaktEmail').value.trim(),
        telefon: document.getElementById('kontaktTelefon').value.trim()
      },
      leistung: Array.from(document.querySelectorAll('input[name=leistung]:checked')).map(c => c.value),
      kinder: kinder,
      sprache: lang
    };
  }

  // Baut aus den familienweiten Daten + einem einzelnen Kind wieder die
  // "flache" Datenstruktur, die fillAichachFriedberg/fillAugsburg/submitToSheet erwarten
  function buildRecordForKind(data, kind) {
    return {
      erziehungsberechtigter: data.erziehungsberechtigter,
      adresse: data.adresse,
      kontakt: data.kontakt,
      leistung: data.leistung,
      sprache: data.sprache,
      behoerde: data.behoerde,
      kind: { vorname: kind.vorname, nachname: kind.nachname, geburtsdatum: kind.geburtsdatum },
      aktivitaet: kind.aktivitaet
    };
  }

  function labelFor(key) {
    return i18n[lang][key] || key;
  }

  function renderSummary(data) {
    const dict = i18n[lang];
    const beziehungMap = {
      mutter: 'erz_beziehung_mutter', vater: 'erz_beziehung_vater',
      sorgeberechtigt: 'erz_beziehung_sorgeberechtigt', vormund: 'erz_beziehung_vormund',
      sonstige: 'erz_beziehung_sonstige'
    };
    const leistungMap = {
      buergergeld: 'leistung_buergergeld', sozialhilfe: 'leistung_sozialhilfe',
      wohngeld: 'leistung_wohngeld', kinderzuschlag: 'leistung_kinderzuschlag',
      asylblg: 'leistung_asylblg'
    };
    const rhythmusMap = {
      monat: 'rhythmus_monat', quartal: 'rhythmus_quartal',
      halbjahr: 'rhythmus_halbjahr', jahr: 'rhythmus_jahr'
    };

    function row(labelKey, value) {
      if (!value) return '';
      return '<div class="summary-row"><span class="k">' + labelFor(labelKey) + '</span><span class="v">' + escapeHtml(value) + '</span></div>';
    }
    function section(titleKey, rowsHtml, titleTextOverride) {
      const title = titleTextOverride !== undefined ? titleTextOverride : labelFor(titleKey);
      return '<div class="summary-section"><h3>' + title + '</h3>' + rowsHtml + '</div>';
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    let html = '';
    html += section('summary_section_erz',
      row('field_erz_name', data.erziehungsberechtigter.name) +
      row('field_erz_geburtsdatum', data.erziehungsberechtigter.geburtsdatum) +
      row('field_erz_beziehung', labelFor(beziehungMap[data.erziehungsberechtigter.beziehung]))
    );
    html += section('summary_section_adresse',
      row('field_adresse_strasse', data.adresse.strasse) +
      row('field_adresse_plz', data.adresse.plz) +
      row('field_adresse_ort', data.adresse.ort)
    );
    html += section('summary_section_kontakt',
      row('field_kontakt_email', data.kontakt.email) +
      row('field_kontakt_telefon', data.kontakt.telefon)
    );
    html += '<div class="summary-section"><h3>' + labelFor('summary_section_leistung') + '</h3>' +
      '<p class="summary-plain">' +
      escapeHtml(data.leistung.map(l => labelFor(leistungMap[l])).join(', ')) +
      '</p></div>';

    (data.kinder || []).forEach((kind, i) => {
      html += section(null,
        row('field_kind_vorname', kind.vorname) +
        row('field_kind_nachname', kind.nachname) +
        row('field_kind_geburtsdatum', kind.geburtsdatum) +
        row('field_aktivitaet_beschreibung', kind.aktivitaet.beschreibung) +
        row('field_zeitraum_von', kind.aktivitaet.zeitraum_von) +
        row('field_zeitraum_bis', kind.aktivitaet.zeitraum_bis) +
        row('field_beitrag_betrag', kind.aktivitaet.beitrag_betrag ? kind.aktivitaet.beitrag_betrag + ' €' : '') +
        row('field_beitrag_rhythmus', labelFor(rhythmusMap[kind.aktivitaet.beitrag_rhythmus])) +
        row('field_faellig_am', kind.aktivitaet.faellig_am),
        labelFor('summary_section_kind') + ' ' + (i + 1)
      );
    });

    document.getElementById('summaryContent').innerHTML = html;
    document.getElementById('summaryGeneratedOn').textContent =
      dict.summary_generated_on + ': ' + new Date().toLocaleDateString(lang, { year: 'numeric', month: '2-digit', day: '2-digit' });
  }

  document.getElementById('btnDownloadPdf').addEventListener('click', () => generateOfficialPdf());

  document.getElementById('langSelect').addEventListener('change', (e) => {
    lang = e.target.value;
    applyLang();
  });

  document.getElementById('btnBack').addEventListener('click', () => {
    if (current > 0) { current--; showStep(); }
  });

  document.getElementById('btnNext').addEventListener('click', async () => {
    if (!validateCurrentStep()) return;

    if (current === totalFormSteps - 1) {
      const data = collectFormData();
      lastFormData = data;
      data.behoerde = detectBehoerde(data.adresse.plz);
      submitToSheet(data); // fire-and-forget, blockiert die UI nicht
      renderSummary(data);
      document.getElementById('behoerdeSelect').value = data.behoerde;
    }

    current++;
    showStep();
  });

  // ============================================================
  // Anbindung ans Google Sheet (Uebergangsloesung bis Vereinsserver)
  // APPS_SCRIPT_URL nach dem Deployment des Apps Script eintragen.
  // Muss mit SHARED_SECRET in apps-script-code.gs uebereinstimmen.
  // ============================================================
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxTnHPnIt6bPiVrX8AtumWAX_Ov_7J4cHXaCjhhf63zV3QUo8q4UQOQotae1KRiWas/exec';
  const SHARED_SECRET = 'tsv1862-but-2026';

  function submitToSheet(data) {
    if (!APPS_SCRIPT_URL) {
      console.warn('APPS_SCRIPT_URL ist noch nicht gesetzt - Antrag wurde NICHT gespeichert.');
      return;
    }
    // Eine Zeile pro Kind, da jedes Kind rechtlich einen eigenen Antrag darstellt
    (data.kinder || []).forEach(kind => {
      const record = buildRecordForKind(data, kind);
      const payload = Object.assign({ secret: SHARED_SECRET }, record);
      // text/plain vermeidet eine CORS-Preflight-Anfrage, die Apps Script nicht beantwortet
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(err => console.error('Sheet-Uebertragung fehlgeschlagen:', err));
    });
  }

  // ============================================================
  // Vereins-Stammdaten (konstant, nicht Teil der Nutzereingabe)
  // WICHTIG: bankinstitut/iban/bic sind BEWUSST Platzhalterdaten
  // für den Prototyp/die Vereinsvorstellung. Vor dem produktiven
  // Einsatz durch die echte Vereins-Bankverbindung ersetzen!
  // ============================================================
  const CLUB_INFO = {
    name: 'TSV 1862 Friedberg e.V.',
    strasse: 'Bauernbräustraße 6',
    plz: '86316',
    ort: 'Friedberg',
    bankinstitut: 'Musterbank (Platzhalter für Prototyp)',
    iban: 'DE89 3704 0044 0532 0130 00',
    bic: 'MUSTDEXXXXX'
  };

  // Stadt Augsburg (kreisfreie Stadt) belegt geschlossen den PLZ-Bereich 86150-86199.
  // Alles andere im Postleitzahlengebiet (z.B. 86316 Friedberg, 86513 Aichach) faellt
  // in den Landkreis Aichach-Friedberg.
  function detectBehoerde(plz) {
    const n = parseInt(String(plz || '').trim(), 10);
    if (!isNaN(n) && n >= 86150 && n <= 86199) return 'augsburg';
    return 'aichach_friedberg';
  }

  function isValidPlz(plz) {
    return /^[0-9]{5}$/.test(String(plz || '').trim());
  }

  function todayDeString() {
    const d = new Date();
    return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
  }

  async function fetchTemplateBytes(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error('Template nicht gefunden: ' + path);
    return await res.arrayBuffer();
  }

  function triggerDownload(bytes, filename) {
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  // --- Landkreis Aichach-Friedberg: echtes ausfuellbares AcroForm ---
  async function fillAichachFriedberg(data) {
    const bytes = await fetchTemplateBytes('pdf-templates/aichach-friedberg.pdf');
    const pdfDoc = await PDFLib.PDFDocument.load(bytes);
    const form = pdfDoc.getForm();

    function setText(fieldName, value) {
      try { form.getTextField(fieldName).setText(value || ''); }
      catch (e) { console.warn('Textfeld nicht gefunden:', fieldName, e); }
    }
    function check(fieldName) {
      try { form.getCheckBox(fieldName).check(); }
      catch (e) { console.warn('Checkbox nicht gefunden:', fieldName, e); }
    }

    const leistungCheckboxMap = {
      buergergeld: 'Arbeitslosengeld II',
      kinderzuschlag: 'Kinderzuschlag',
      asylblg: 'AsylbLG',
      wohngeld: 'Wohngeld'
      // Sozialhilfe: dieses Formular kennt kein eigenes Feld dafuer
    };
    data.leistung.forEach(l => { if (leistungCheckboxMap[l]) check(leistungCheckboxMap[l]); });

    setText('Name', data.kind.nachname);
    setText('Vorname', data.kind.vorname);
    setText('Geburtsdatum', data.kind.geburtsdatum);
    setText('Adresse', data.adresse.strasse + ', ' + data.adresse.plz + ' ' + data.adresse.ort);
    setText('Telefon', data.kontakt.telefon);

    check('Aktivitäten in Vereinen');
    setText('bis', data.aktivitaet.zeitraum_von);                       // visuell "vom"
    setText('an folgender Aktivität teil', data.aktivitaet.zeitraum_bis); // visuell "bis"
    setText('AktivitätVereinsmitgliedschaft', data.aktivitaet.beschreibung);
    setText('Name und Anschrift des LeistungsanbietersVereins',
      CLUB_INFO.name + ', ' + CLUB_INFO.strasse + ', ' + CLUB_INFO.plz + ' ' + CLUB_INFO.ort);
    setText('€ im', data.aktivitaet.beitrag_betrag);

    const rhythmusCheckboxMap = {
      monat: 'Monat', quartal: 'Quartal', halbjahr: 'Halbjahr',
      jahr: 'Jahr Der Betrag ist fällig am'
    };
    if (rhythmusCheckboxMap[data.aktivitaet.beitrag_rhythmus]) check(rhythmusCheckboxMap[data.aktivitaet.beitrag_rhythmus]);
    setText('undefined', data.aktivitaet.faellig_am);
    setText('OrtDatum', data.adresse.ort + ', ' + todayDeString());

    return await pdfDoc.save();
  }

  // --- Stadt Augsburg: kein AcroForm, Text wird per Koordinaten platziert ---
  async function fillAugsburg(data) {
    const bytes = await fetchTemplateBytes('pdf-templates/augsburg.pdf');
    const pdfDoc = await PDFLib.PDFDocument.load(bytes);
    const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const pages = pdfDoc.getPages();
    const pageHeight = pages[0].getHeight();

    // Koordinaten wie form_structure.json: [x0, top, x1(ungenutzt), bottom], top-down
    function put(pageIndex, x0, top, bottom, text, size) {
      if (!text) return;
      const y = pageHeight - bottom + 2;
      pages[pageIndex].drawText(String(text), { x: x0 + 1, y, size: size || 9, font, color: PDFLib.rgb(0, 0, 0) });
    }
    function mark(pageIndex, x0, top, bottom) {
      const y = pageHeight - bottom + 1;
      pages[pageIndex].drawText('X', { x: x0 + 1, y, size: 7, font, color: PDFLib.rgb(0, 0, 0) });
    }

    const leistungCheckboxCoords = {
      buergergeld: [63.7, 113.8, 121.8],
      sozialhilfe: [191.5, 113.8, 121.8],
      wohngeld: [63.7, 129.4, 137.4],
      kinderzuschlag: [191.5, 129.4, 137.4],
      asylblg: [319.4, 129.4, 137.4]
    };
    data.leistung.forEach(l => { if (leistungCheckboxCoords[l]) mark(0, ...leistungCheckboxCoords[l]); });

    put(0, 248, 193, 206.5, data.erziehungsberechtigter.name + ', geb. ' + data.erziehungsberechtigter.geburtsdatum);
    put(0, 248, 218.5, 232, data.adresse.strasse + ', ' + data.adresse.plz + ' ' + data.adresse.ort);
    put(0, 248, 239.8, 253.3, data.kontakt.telefon);

    put(0, 62.4, 338, 352, data.kind.nachname);
    put(0, 218.7, 338, 352, data.kind.vorname);
    put(0, 395.0, 338, 352, data.kind.geburtsdatum);

    mark(0, 63.5, 587.2, 595.3); // Teilhabe am sozialen und kulturellen Leben

    put(3, 56.6, 206, 220, data.kind.nachname);
    put(3, 255.5, 206, 220, data.kind.vorname);
    put(3, 454.3, 206, 220, data.kind.geburtsdatum);

    mark(3, 57.7, 271.6, 279.6); // Uebernahme des Mitgliedsbeitrages in einem Sportverein

    put(3, 150, 390.5, 399.5, CLUB_INFO.name);
    put(3, 150, 411.3, 420.3, CLUB_INFO.strasse);
    put(3, 100, 431.9, 440.9, CLUB_INFO.plz + ' ' + CLUB_INFO.ort);
    put(3, 172, 494.1, 503.1, data.aktivitaet.beschreibung);
    put(3, 150, 514.7, 523.7, data.aktivitaet.zeitraum_von + ' - ' + data.aktivitaet.zeitraum_bis);
    put(3, 173, 556.1, 565.1, data.aktivitaet.beitrag_betrag);

    const rhythmusCoords = {
      monat: [185.5, 576.7, 584.7], quartal: [237.9, 576.7, 584.7],
      halbjahr: [294.8, 576.7, 584.7], jahr: [355.6, 576.7, 584.7]
    };
    if (rhythmusCoords[data.aktivitaet.beitrag_rhythmus]) mark(3, ...rhythmusCoords[data.aktivitaet.beitrag_rhythmus]);

    put(3, 110, 628.6, 637.6, CLUB_INFO.bankinstitut);
    put(3, 85, 649.3, 658.3, CLUB_INFO.iban);
    put(3, 80, 670.0, 679.0, CLUB_INFO.bic);
    put(3, 145, 690.7, 699.7, 'Mitgliedsbeitrag ' + data.kind.vorname + ' ' + data.kind.nachname);

    return await pdfDoc.save();
  }

  async function generateOfficialPdf() {
    if (!lastFormData) return;
    const dict = i18n[lang];
    const statusEl = document.getElementById('pdfStatus');
    const btn = document.getElementById('btnDownloadPdf');
    const behoerde = document.getElementById('behoerdeSelect').value;
    const behoerdeLabel = behoerde === 'augsburg' ? 'Augsburg' : 'Aichach-Friedberg';

    statusEl.className = 'pdf-status';
    statusEl.style.display = 'block';
    statusEl.textContent = dict.pdf_generating;
    btn.disabled = true;

    try {
      const kinder = lastFormData.kinder || [];

      if (kinder.length === 1) {
        const record = buildRecordForKind(lastFormData, kinder[0]);
        const bytes = behoerde === 'augsburg' ? await fillAugsburg(record) : await fillAichachFriedberg(record);
        const filename = 'BuT-Antrag_' + behoerdeLabel + '_' + (kinder[0].nachname || 'Antrag').replace(/[^\w\-]/g, '') + '.pdf';
        triggerDownload(bytes, filename);
      } else {
        // Mehrere Kinder: pro Kind ein eigenes PDF (rechtlich vorgeschrieben), gebuendelt als ZIP
        const zip = new JSZip();
        for (const kind of kinder) {
          const record = buildRecordForKind(lastFormData, kind);
          const bytes = behoerde === 'augsburg' ? await fillAugsburg(record) : await fillAichachFriedberg(record);
          const filename = 'BuT-Antrag_' + behoerdeLabel + '_' + (kind.nachname || 'Antrag').replace(/[^\w\-]/g, '') + '_' + (kind.vorname || '').replace(/[^\w\-]/g, '') + '.pdf';
          zip.file(filename, bytes);
        }
        const zipBytes = await zip.generateAsync({ type: 'uint8array' });
        const zipBlob = new Blob([zipBytes], { type: 'application/zip' });
        const zipUrl = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = zipUrl;
        a.download = 'BuT-Antraege_' + behoerdeLabel + '.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(zipUrl), 30000);
      }

      statusEl.style.display = 'none';
    } catch (err) {
      console.error(err);
      statusEl.className = 'pdf-status error';
      statusEl.textContent = dict.pdf_error;
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById('btnAddKind').addEventListener('click', () => addKindBlock());

  addKindBlock(); // Formular startet mit genau einem Kind-Block
  applyLang();
  showStep();
  if (DEV_MODE_SKIP_VALIDATION) {
    document.getElementById('devModeBadge').style.display = 'block';
  }
})();
</script>
