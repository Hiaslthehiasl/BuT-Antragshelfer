<!-- deploy: Hiaslthehiasl/BuT-Antragshelfer -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuT-Antragshelfer - TSV 1862 Friedberg</title>
<style>
  :root {
    --petrol: #0D7377;
    --petrol-dark: #095457;
    --ink: #1C2B2D;
    --paper: #FAFAF8;
    --line: #D8DFDE;
    --error: #B3261E;
    --ok: #1E7B4D;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
  }
  html[dir="rtl"] body { direction: rtl; }

  .shell { max-width: 640px; margin: 0 auto; padding: 24px 20px 80px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; gap: 12px; flex-wrap: wrap;
  }
  header.top h1 { font-size: 1.25rem; margin: 0; color: var(--petrol-dark); }

  select#langSelect {
    font-size: 0.9rem; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: var(--radius); background: #fff; color: var(--ink);
  }

  .intro {
    background: #EEF6F6; border: 1px solid #CFE6E6; border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 24px;
  }
  .intro h2 { margin: 0 0 8px; font-size: 1rem; color: var(--petrol-dark); }
  .intro p { margin: 0; font-size: 0.92rem; }

  .progress {
    display: flex; gap: 6px; margin-bottom: 24px;
  }
  .progress .seg {
    flex: 1; height: 4px; border-radius: 2px; background: var(--line);
  }
  .progress .seg.done { background: var(--petrol); }

  .step { display: none; }
  .step.active { display: block; }

  .step h2 { font-size: 1.1rem; margin: 0 0 4px; }
  .step .hint { font-size: 0.85rem; color: #556; margin: 0 0 18px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; }
  .field .req { color: var(--petrol); font-weight: 400; }
  .field input[type=text],
  .field input[type=email],
  .field input[type=tel],
  .field input[type=date],
  .field input[type=number],
  .field select {
    width: 100%; padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: #fff; color: var(--ink);
  }
  .field input:focus, .field select:focus {
    outline: 2px solid var(--petrol); outline-offset: 1px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 12px; }
  @media (max-width: 480px) {
    .row2, .row3 { grid-template-columns: 1fr; }
  }

  .checkbox-group { display: flex; flex-direction: column; gap: 10px; }
  .checkbox-item {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; cursor: pointer;
  }
  .checkbox-item input { margin-top: 3px; width: 18px; height: 18px; flex-shrink: 0; }
  .checkbox-item span { font-size: 0.95rem; }

  .consent-box {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; font-size: 0.88rem; margin-bottom: 16px;
  }

  .nav-buttons {
    display: flex; justify-content: space-between; margin-top: 28px; gap: 12px;
  }
  button {
    font-size: 1rem; padding: 12px 22px; border-radius: var(--radius);
    border: 1px solid var(--petrol); cursor: pointer; font-weight: 600;
  }
  button.primary { background: var(--petrol); color: #fff; }
  button.primary:hover { background: var(--petrol-dark); }
  button.secondary { background: transparent; color: var(--petrol); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .success {
    text-align: center; padding: 40px 20px;
  }
  .success .icon {
    width: 56px; height: 56px; border-radius: 50%; background: var(--ok);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin: 0 auto 16px;
  }
  .success h2 { color: var(--ok); margin-bottom: 8px; }

  .error-msg {
    color: var(--error); font-size: 0.85rem; margin-top: 4px; display: none;
  }
  .field.invalid input, .field.invalid select { border-color: var(--error); }
  .field.invalid .error-msg { display: block; }
</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <h1 id="appTitle">Zuschuss beantragen</h1>
    <select id="langSelect" aria-label="Sprache">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="tr">Türkçe</option>
      <option value="ar">العربية</option>
      <option value="ru">Русский</option>
      <option value="uk">Українська</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
    </select>
  </header>

  <div class="intro">
    <h2 id="introTitle"></h2>
    <p id="introText"></p>
  </div>

  <div class="progress" id="progressBar"></div>

  <form id="butForm" novalidate>

    <!-- Step 1: Stammdaten -->
    <section class="step active" data-step="0">
      <h2 id="step1Title"></h2>

      <div class="field">
        <label for="kindVorname"><span data-t="field_kind_vorname"></span> <span class="req">*</span></label>
        <input type="text" id="kindVorname" required>
        <div class="error-msg" data-t="required_hint"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="kindNachname"><span data-t="field_kind_nachname"></span> <span class="req">*</span></label>
          <input type="text" id="kindNachname" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
        <div class="field">
          <label for="kindGeburtsdatum"><span data-t="field_kind_geburtsdatum"></span> <span class="req">*</span></label>
          <input type="date" id="kindGeburtsdatum" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
      </div>

      <div class="field">
        <label for="erzName"><span data-t="field_erz_name"></span> <span class="req">*</span></label>
        <input type="text" id="erzName" required>
        <div class="error-msg" data-t="required_hint"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="erzGeburtsdatum"><span data-t="field_erz_geburtsdatum"></span> <span class="req">*</span></label>
          <input type="date" id="erzGeburtsdatum" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
        <div class="field">
          <label for="erzBeziehung"><span data-t="field_erz_beziehung"></span> <span class="req">*</span></label>
          <select id="erzBeziehung" required>
            <option value="mutter" data-t="erz_beziehung_mutter"></option>
            <option value="vater" data-t="erz_beziehung_vater"></option>
            <option value="sorgeberechtigt" data-t="erz_beziehung_sorgeberechtigt"></option>
            <option value="vormund" data-t="erz_beziehung_vormund"></option>
            <option value="sonstige" data-t="erz_beziehung_sonstige"></option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="adresseStrasse"><span data-t="field_adresse_strasse"></span> <span class="req">*</span></label>
        <input type="text" id="adresseStrasse" required>
        <div class="error-msg" data-t="required_hint"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="adressePlz"><span data-t="field_adresse_plz"></span> <span class="req">*</span></label>
          <input type="text" id="adressePlz" required inputmode="numeric">
          <div class="error-msg" data-t="required_hint"></div>
        </div>
        <div class="field">
          <label for="adresseOrt"><span data-t="field_adresse_ort"></span> <span class="req">*</span></label>
          <input type="text" id="adresseOrt" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="kontaktEmail"><span data-t="field_kontakt_email"></span> <span class="req">*</span></label>
          <input type="email" id="kontaktEmail" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
        <div class="field">
          <label for="kontaktTelefon"><span data-t="field_kontakt_telefon"></span> <span class="req">*</span></label>
          <input type="tel" id="kontaktTelefon" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
      </div>
    </section>

    <!-- Step 2: Leistungsbezug -->
    <section class="step" data-step="1">
      <h2 id="step2Title"></h2>
      <div class="checkbox-group" id="leistungGroup">
        <label class="checkbox-item">
          <input type="checkbox" name="leistung" value="buergergeld">
          <span data-t="leistung_buergergeld"></span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="leistung" value="sozialhilfe">
          <span data-t="leistung_sozialhilfe"></span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="leistung" value="wohngeld">
          <span data-t="leistung_wohngeld"></span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="leistung" value="kinderzuschlag">
          <span data-t="leistung_kinderzuschlag"></span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="leistung" value="asylblg">
          <span data-t="leistung_asylblg"></span>
        </label>
      </div>
      <div class="error-msg" id="leistungError" data-t="required_hint" style="display:none;"></div>
    </section>

    <!-- Step 3: Vereinsaktivitaet -->
    <section class="step" data-step="2">
      <h2 id="step3Title"></h2>
      <p class="hint" id="step3Hint"></p>

      <div class="field">
        <label for="aktBeschreibung"><span data-t="field_aktivitaet_beschreibung"></span> <span class="req">*</span></label>
        <input type="text" id="aktBeschreibung" required>
        <div class="error-msg" data-t="required_hint"></div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="zeitraumVon"><span data-t="field_zeitraum_von"></span> <span class="req">*</span></label>
          <input type="date" id="zeitraumVon" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
        <div class="field">
          <label for="zeitraumBis"><span data-t="field_zeitraum_bis"></span> <span class="req">*</span></label>
          <input type="date" id="zeitraumBis" required>
          <div class="error-msg" data-t="required_hint"></div>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="beitragBetrag"><span data-t="field_beitrag_betrag"></span> <span class="req">*</span></label>
          <input type="number" id="beitragBetrag" required min="0" step="0.01">
          <div class="error-msg" data-t="required_hint"></div>
        </div>
        <div class="field">
          <label for="beitragRhythmus"><span data-t="field_beitrag_rhythmus"></span> <span class="req">*</span></label>
          <select id="beitragRhythmus" required>
            <option value="monat" data-t="rhythmus_monat"></option>
            <option value="quartal" data-t="rhythmus_quartal"></option>
            <option value="halbjahr" data-t="rhythmus_halbjahr"></option>
            <option value="jahr" data-t="rhythmus_jahr"></option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="faelligAm"><span data-t="field_faellig_am"></span> <span class="req">*</span></label>
        <input type="text" id="faelligAm" required>
        <div style="font-size:0.8rem;color:#556;margin-top:4px;" id="faelligAmHint"></div>
        <div class="error-msg" data-t="required_hint"></div>
      </div>
    </section>

    <!-- Step 4: Einwilligung -->
    <section class="step" data-step="3">
      <h2 id="consentTitle"></h2>
      <div class="consent-box" id="consentText"></div>
      <label class="checkbox-item">
        <input type="checkbox" id="consentCheckbox" required>
        <span id="consentCheckboxLabel"></span>
      </label>
      <div class="error-msg" id="consentError" data-t="required_hint" style="display:none;"></div>
    </section>

    <!-- Success -->
    <section class="step" data-step="4">
      <div class="success">
        <div class="icon">&#10003;</div>
        <h2 id="successTitle"></h2>
        <p id="successText"></p>
      </div>
    </section>

    <div class="nav-buttons" id="navButtons">
      <button type="button" class="secondary" id="btnBack"></button>
      <button type="button" class="primary" id="btnNext"></button>
    </div>

  </form>
</div>

    progressBar.innerHTML = '';
    for (let i = 0; i < totalFormSteps; i++) {
      const seg = document.createElement('div');
      seg.className = 'seg' + (i <= current && current < totalFormSteps ? (i < current || current === i ? ' done' : '') : '');
      if (current >= totalFormSteps) seg.classList.add('done');
      else if (i <= current) seg.classList.add('done');
      progressBar.appendChild(seg);
    }
    progressBar.style.display = current >= totalFormSteps ? 'none' : 'flex';
  }

  function applyLang() {
    const dict = i18n[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = RTL_LANGS.includes(lang) ? 'rtl' : 'ltr';

    document.getElementById('appTitle').textContent = dict.app_title;
    document.getElementById('introTitle').textContent = dict.intro_title;
    document.getElementById('introText').textContent = dict.intro_text;
    document.getElementById('step1Title').textContent = dict.step1_title;
    document.getElementById('step2Title').textContent = dict.step2_title;
    document.getElementById('step3Title').textContent = dict.step3_title;
    document.getElementById('step3Hint').textContent = dict.step3_hint;
    document.getElementById('faelligAmHint').textContent = dict.field_faellig_am_hint;
    document.getElementById('consentTitle').textContent = dict.step_consent_title;
    document.getElementById('consentText').textContent = dict.consent_text;
    document.getElementById('consentCheckboxLabel').textContent = dict.consent_checkbox;
    document.getElementById('successTitle').textContent = dict.submit_success_title;
    document.getElementById('successText').textContent = dict.submit_success_text;
    document.getElementById('aktBeschreibung').placeholder = dict.field_aktivitaet_beschreibung_placeholder;

    document.querySelectorAll('[data-t]').forEach(el => {
      const key = el.getAttribute('data-t');
      if (dict[key] !== undefined) el.textContent = dict[key];
    });

    updateNavButtons();
  }

  function updateNavButtons() {
    const dict = i18n[lang];
    const backBtn = document.getElementById('btnBack');
    const nextBtn = document.getElementById('btnNext');
    backBtn.textContent = dict.button_back;
    backBtn.style.visibility = current === 0 ? 'hidden' : 'visible';
    if (current >= totalFormSteps) {
      document.getElementById('navButtons').style.display = 'none';
    } else {
      document.getElementById('navButtons').style.display = 'flex';
      nextBtn.textContent = current === totalFormSteps - 1 ? dict.button_submit : dict.button_next;
    }
  }

  function showStep() {
    steps.forEach(s => s.classList.toggle('active', Number(s.dataset.step) === current));
    renderProgress();
    updateNavButtons();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function validateCurrentStep() {
    let valid = true;
    const stepEl = steps.find(s => Number(s.dataset.step) === current);
    if (!stepEl) return true;

    const inputs = stepEl.querySelectorAll('input[required], select[required]');
    inputs.forEach(inp => {
      const field = inp.closest('.field');
      const ok = inp.type === 'checkbox' ? inp.checked : inp.value.trim() !== '';
      if (!ok) {
        valid = false;
        if (field) field.classList.add('invalid');
      } else if (field) {
        field.classList.remove('invalid');
      }
    });

    if (current === 1) {
      const anyChecked = Array.from(document.querySelectorAll('input[name=leistung]')).some(c => c.checked);
      document.getElementById('leistungError').style.display = anyChecked ? 'none' : 'block';
      if (!anyChecked) valid = false;
    }

    if (current === 3) {
      const consentOk = document.getElementById('consentCheckbox').checked;
      document.getElementById('consentError').style.display = consentOk ? 'none' : 'block';
      if (!consentOk) valid = false;
    }

    return valid;
  }

  function collectFormData() {
    return {
      kind: {
        vorname: document.getElementById('kindVorname').value.trim(),
        nachname: document.getElementById('kindNachname').value.trim(),
        geburtsdatum: document.getElementById('kindGeburtsdatum').value
      },
      erziehungsberechtigter: {
        name: document.getElementById('erzName').value.trim(),
        geburtsdatum: document.getElementById('erzGeburtsdatum').value,
        beziehung: document.getElementById('erzBeziehung').value
      },
      adresse: {
        strasse: document.getElementById('adresseStrasse').value.trim(),
        plz: document.getElementById('adressePlz').value.trim(),
        ort: document.getElementById('adresseOrt').value.trim()
      },
      kontakt: {
        email: document.getElementById('kontaktEmail').value.trim(),
        telefon: document.getElementById('kontaktTelefon').value.trim()
      },
      leistung: Array.from(document.querySelectorAll('input[name=leistung]:checked')).map(c => c.value),
      aktivitaet: {
        beschreibung: document.getElementById('aktBeschreibung').value.trim(),
        zeitraum_von: document.getElementById('zeitraumVon').value,
        zeitraum_bis: document.getElementById('zeitraumBis').value,
        beitrag_betrag: document.getElementById('beitragBetrag').value,
        beitrag_rhythmus: document.getElementById('beitragRhythmus').value,
        faellig_am: document.getElementById('faelligAm').value.trim()
      },
      sprache: lang
    };
  }

  document.getElementById('langSelect').addEventListener('change', (e) => {
    lang = e.target.value;
    applyLang();
  });

  document.getElementById('btnBack').addEventListener('click', () => {
    if (current > 0) { current--; showStep(); }
  });

  document.getElementById('btnNext').addEventListener('click', () => {
    if (!validateCurrentStep()) return;

    if (current === totalFormSteps - 1) {
      const data = collectFormData();
      // TODO: an Supabase (members + cases) uebergeben, siehe schema.sql
      console.log('BuT-Antrag:', data);
    }

    current++;
    showStep();
  });

  applyLang();
  showStep();
})();
</script>
</body>
</html>
